<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X3non</title>
    <link rel="icon" type="image/x-icon" href="https://x3nonmod.github.io/dev/images/x3non_icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #e0e0e0;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #181818;
            border-bottom: 1px solid #2a2a2a;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            height: 60px;
        }
        header nav .left,
        header nav .right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        header nav a {
            color: #b0b0b0;
            text-decoration: none;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 4px;
            transition: color 0.2s ease, background-color 0.2s ease;
        }
        header nav a:hover {
            color: #ffffff;
            background-color: #252525;
        }
        header nav .btn-action {
            background-color: #ff5722;
            color: white;
        }
        header nav .btn-action:hover {
            background-color: #e64a19;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 20px;
            flex: 1;
        }
        .hero {
            text-align: center;
            padding: 40px 0;
        }
        .hero h1 {
            font-size: 2.8rem;
            margin-bottom: 20px;
            color: #ffeb3b;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .hero p {
            font-size: 1.2rem;
            color: #aaaaaa;
            max-width: 700px;
            margin: 0 auto 35px auto;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .buttons a {
            display: inline-block;
            padding: 12px 24px;
            color: white;
            background-color: #ff5722;
            border-radius: 6px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }
        .buttons a:hover {
            background-color: #e64a19;
            transform: translateY(-2px);
        }
        .buttons a.secondary {
            background-color: #252525;
            color: #e0e0e0;
            border: 1px solid #333;
        }
        .buttons a.secondary:hover {
            background-color: #303030;
        }
        .section {
            margin-top: 60px;
            background-color: #181818;
            border: 1px solid #252525;
            border-radius: 8px;
            padding: 30px;
        }
        .section h2 {
            margin-top: 0;
            font-size: 1.6rem;
            color: #ffeb3b;
        }
        .section p {
            color: #b0b0b0;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="left">
                <a href="#"><img src="../images/x3non_title.png" alt="X3non Logo" height="32"></a>
                <a href="https://x3nonmod.github.io/#scratch">Create</a>
                <a href="https://kylekart.github.io/ScratchExtensions/#x3">Extensions</a>
            </div>
            <div class="right">
            </div>
        </nav>
    </header>

<div class="container">
        <div class="intro">
            <h1>X3non Engine</h1>
            <p>An advanced ScratchX-based environment for custom extensions and interactive projects.</p>
            <div class="buttons">
                <a href="https://x3nonmod.github.io/#scratch">Try X3non</a>
                <a href="https://kylekart.github.io/ScratchExtensions/#x3">View Extensions</a>
            </div>
        </div>
    </div>
</body>
</html>
